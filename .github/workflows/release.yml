name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to package and release (for example, v0.3.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check

      - name: Verify tag matches package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$RELEASE_TAG" ]; then
            echo "Tag $RELEASE_TAG does not match package.json version v$version" >&2
            exit 1
          fi

      - name: Pack
        run: |
          npm pack
          tarball="$(ls -1t ./*.tgz | head -n1)"
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: release-tarball
          path: "*.tgz"
          if-no-files-found: error

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$TARBALL" --clobber
          else
            gh release create "$RELEASE_TAG" "$TARBALL" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
